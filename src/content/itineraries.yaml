# Ceylon Wayfarer — itineraries data file
# 5 itineraries for the itinerary pages (one page per entry, URL = /itineraries/<slug>).
# Distances and drive times are estimates: verify on Google Maps before launch.
# heroImage / image are file names in src/assets/images/ .
# A day with no image uses the itinerary's heroImage. The last day has an empty overnight (guests fly home).
#
# path: the stops this day passes on the map (ids from src/data/mapStops.ts). One stop = a local day.
# order: position in itinerary lists.
# Price = totalDistanceKm × site.pricing.perKm + days × site.pricing.perDayMultiDay (calculated, not stored).
# Credits for the photos are in src/assets/images/CREDITS.md.

- title: "7 Days Classic Sri Lanka"
  slug: "7-days-classic-sri-lanka"
  order: 1
  days: 7
  nights: 6
  summary: "The island's greatest hits in one week: Sigiriya, Kandy, tea country, Ella, a Yala safari and Galle Fort. A favourite route for first-time visitors."
  start: "BIA"
  end: "BIA"
  totalDistanceKm: 810
  bestMonths: "December–April — dry season in the hill country and on the south coast, when Yala safaris are at their best"
  heroImage: "hero.jpg"
  mapStops:
    - name: "Bandaranaike Airport (BIA)"
    - name: "Dambulla"
    - name: "Sigiriya"
    - name: "Kandy"
    - name: "Nuwara Eliya"
    - name: "Ella"
    - name: "Tissamaharama (Yala)"
    - name: "Galle"
    - name: "Bandaranaike Airport (BIA)"
  itinerary:
    - day: "1"
      title: "Airport → Sigiriya"
      from: "BIA"
      to: "Sigiriya"
      path: [bia, dambulla, sigiriya]  # map stops for this day, see src/data/mapStops.ts
      distanceKm: 160
      driveTime: "~4 h"
      highlights: ["Dambulla cave temple", "Village roads"]
      description: "I meet you at arrivals with a name sign and we head north to the Cultural Triangle. We stop at the Dambulla cave temple on the way, then you check in near Sigiriya for the evening."
      overnight: "Sigiriya"
      tip: "Bring clothes that cover shoulders and knees for Dambulla, and leave shoes at the entrance."
      image: "sigiriya.jpg"
    - day: "2"
      title: "Sigiriya rock & elephant safari"
      from: "Sigiriya"
      to: "Sigiriya"
      path: [sigiriya]  # map stops for this day, see src/data/mapStops.ts
      distanceKm: 60
      driveTime: "~1.5 h"
      highlights: ["Sigiriya rock", "Minneriya safari"]
      description: "I drop you at Sigiriya early so you climb before the heat and the crowds. In the afternoon I drive you to Minneriya or Kaudulla, whichever park the elephants are using that week, for a jeep safari."
      overnight: "Sigiriya"
      tip: "Be at the Sigiriya gate when it opens; by 10 am the stairs are hot and busy."
      image: "elephants.jpg"
    - day: "3"
      title: "Sigiriya → Kandy"
      from: "Sigiriya"
      to: "Kandy"
      path: [sigiriya, kandy]  # map stops for this day, see src/data/mapStops.ts
      distanceKm: 90
      driveTime: "~3 h"
      highlights: ["Spice garden", "Temple of the Tooth", "Kandy Lake"]
      description: "We drive south through Matale, where you can stop at a spice garden if you like. In Kandy I drop you at the Temple of the Tooth for the evening ceremony, then at your hotel."
      overnight: "Kandy"
      tip: "The temple is most atmospheric during the evening puja, around 6:30 pm."
      image: "temple.jpg"
    - day: "4"
      title: "Kandy → Nuwara Eliya"
      from: "Kandy"
      to: "Nuwara Eliya"
      path: [kandy, nuwara]  # map stops for this day, see src/data/mapStops.ts
      distanceKm: 77
      driveTime: "~3 h"
      highlights: ["Tea factory", "Ramboda Falls", "Gregory Lake"]
      description: "The road climbs into tea country with plenty of waterfalls and viewpoints. We stop at a working tea factory for a tour and tasting before Nuwara Eliya."
      overnight: "Nuwara Eliya"
      tip: "Pack a warm layer; evenings in Nuwara Eliya can drop to around 10 °C."
      image: "tea.jpg"
    - day: "5"
      title: "Nuwara Eliya → Ella"
      from: "Nuwara Eliya"
      to: "Ella"
      path: [nuwara, ella]  # map stops for this day, see src/data/mapStops.ts
      distanceKm: 55
      driveTime: "~2 h"
      highlights: ["Hill-country train", "Nine Arch Bridge", "Little Adam's Peak"]
      description: "You ride the famous scenic train from Nanu Oya to Ella while I drive your luggage round and meet you at Ella station. Afternoon free for the Nine Arch Bridge or Little Adam's Peak."
      overnight: "Ella"
      tip: "The train from Kandy itself is still suspended after Cyclone Ditwah, so Nanu Oya is the place to board; ask me to book reserved seats early."
      image: "hero.jpg"
    - day: "6"
      title: "Ella → Yala"
      from: "Ella"
      to: "Tissamaharama"
      path: [ella, tissa]  # map stops for this day, see src/data/mapStops.ts
      distanceKm: 90
      driveTime: "~2.5 h"
      highlights: ["Ravana Falls", "Yala safari"]
      description: "We drive down out of the hills past Ravana Falls to Tissamaharama. In the afternoon you join a jeep safari in Yala, home to leopards, elephants and sloth bears."
      overnight: "Tissamaharama"
      tip: "Afternoon safaris start around 2:30 pm; book a jeep with a smaller group for better views."
      image: "leopard.jpg"
    - day: "7"
      title: "Yala → Galle Fort → Airport"
      from: "Tissamaharama"
      to: "BIA"
      path: [tissa, galle, bia]  # map stops for this day, see src/data/mapStops.ts
      distanceKm: 280
      driveTime: "~5 h"
      highlights: ["Galle Fort", "Southern Expressway"]
      description: "We follow the south coast to Galle, where you can walk the fort ramparts and have lunch. Then I take the expressway back to the airport in time for your flight."
      overnight: ""
      tip: "Tell me your flight time on day one so I can plan how long you get in Galle."
      image: "galle.jpg"

